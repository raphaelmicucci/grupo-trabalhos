name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase secrets into config
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          # Validate that all required secrets are set
          missing=()
          [ -z "$FIREBASE_API_KEY" ]             && missing+=("FIREBASE_API_KEY")
          [ -z "$FIREBASE_AUTH_DOMAIN" ]          && missing+=("FIREBASE_AUTH_DOMAIN")
          [ -z "$FIREBASE_PROJECT_ID" ]           && missing+=("FIREBASE_PROJECT_ID")
          [ -z "$FIREBASE_STORAGE_BUCKET" ]       && missing+=("FIREBASE_STORAGE_BUCKET")
          [ -z "$FIREBASE_MESSAGING_SENDER_ID" ]  && missing+=("FIREBASE_MESSAGING_SENDER_ID")
          [ -z "$FIREBASE_APP_ID" ]               && missing+=("FIREBASE_APP_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following required secrets are not set: ${missing[*]}"
            exit 1
          fi

          # Use Python for safe substitution (handles special characters correctly)
          python3 - <<'EOF'
          import os, pathlib
          config = pathlib.Path("js/firebase-config.js").read_text()
          replacements = {
            "__FIREBASE_API_KEY__":             os.environ["FIREBASE_API_KEY"],
            "__FIREBASE_AUTH_DOMAIN__":         os.environ["FIREBASE_AUTH_DOMAIN"],
            "__FIREBASE_PROJECT_ID__":          os.environ["FIREBASE_PROJECT_ID"],
            "__FIREBASE_STORAGE_BUCKET__":      os.environ["FIREBASE_STORAGE_BUCKET"],
            "__FIREBASE_MESSAGING_SENDER_ID__": os.environ["FIREBASE_MESSAGING_SENDER_ID"],
            "__FIREBASE_APP_ID__":              os.environ["FIREBASE_APP_ID"],
          }
          for token, value in replacements.items():
            config = config.replace(token, value)
          pathlib.Path("js/firebase-config.js").write_text(config)
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
