<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Atividades Acadêmicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading-overlay"><span>Carregando...</span></div>

  <main class="auth-wrapper">
    <div class="auth-logo">Atividades<br>Acadêmicas</div>

    <div class="auth-card">
      <div id="alert" class="alert alert-error hidden"></div>

      <form id="login-form" autocomplete="on" novalidate>
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username"
                 required autocomplete="username" placeholder="seu_usuario">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password"
                 required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn"
                style="width:100%">Entrar</button>
      </form>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
