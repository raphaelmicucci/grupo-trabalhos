<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar Senha — Atividades Acadêmicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading-overlay"><span>Carregando...</span></div>

  <main class="auth-wrapper">
    <div class="auth-logo">Alterar<br>Senha</div>

    <div class="auth-card">
      <p style="margin-bottom:1.25rem;font-size:0.85rem;color:var(--text-muted)">
        Por segurança, você precisa definir uma nova senha no primeiro acesso.
        Use no mínimo 8 caracteres.
      </p>

      <div id="alert" class="alert alert-error hidden"></div>

      <form id="change-form" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="new-password">Nova senha</label>
          <input type="password" id="new-password" required
                 minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirmar nova senha</label>
          <input type="password" id="confirm-password" required
                 minlength="8" autocomplete="new-password" placeholder="Repita a nova senha">
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn"
                style="width:100%">Salvar nova senha</button>
      </form>
    </div>

    <div class="auth-footer">
      <a href="#" id="logout-link">Sair</a>
    </div>
  </main>

  <script type="module" src="js/change-password.js"></script>
</body>
</html>
