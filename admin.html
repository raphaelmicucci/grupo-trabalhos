<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Atividades Acadêmicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading-overlay"><span>Carregando...</span></div>

  <header>
    <div class="header-inner">
      <span class="header-title">🛠 Painel Admin</span>
      <span class="header-user" id="user-name"></span>
      <a href="dashboard.html" class="btn btn-small">Dashboard</a>
      <button class="btn btn-small" id="logout-btn">Sair</button>
    </div>
  </header>

  <main class="container" style="padding-top:1.5rem">

    <!-- Admin tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="subjects">Disciplinas</button>
      <button class="tab" data-tab="activities">Atividades</button>
      <button class="tab" data-tab="enrollments">Matrículas</button>
    </div>

    <!-- Dynamic tab content -->
    <div id="tab-content">
      <div class="empty-state">Carregando...</div>
    </div>

  </main>

  <!-- Shared modal -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true"
       aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title"></span>
        <button class="modal-close" id="modal-close" aria-label="Fechar">&times;</button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn" id="modal-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-save">Salvar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
